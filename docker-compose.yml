services:
  postgres:
    image: postgres:16-alpine
    container_name: gridsphere-postgres
    environment:
      POSTGRES_DB: gridsphere
      POSTGRES_USER: gridsphere
      POSTGRES_PASSWORD: gridsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridsphere -d gridsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: gridsphere-backend
    environment:
      DATABASE_URL: postgresql+psycopg://gridsphere:gridsphere@postgres:5432/gridsphere
      JWT_SECRET: change-me-in-production
      BACKEND_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: gridsphere-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
